<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotaVault - Digital Business Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 3.5in;
            height: 2in;
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            padding: 0.35in;
            border-radius: 0.15in;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 11pt;
            line-height: 1.4;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(50%, -50%);
        }

        .card-content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            height: 100%;
            flex-direction: column;
        }

        .card-header {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 22pt;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.1in;
        }

        .tagline {
            font-size: 9pt;
            opacity: 0.9;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .card-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
            margin: 0.1in 0;
        }

        .card-footer {
            font-size: 9pt;
            line-height: 1.3;
        }

        .contact-item {
            margin: 0.05in 0;
            display: flex;
            align-items: center;
        }

        .contact-label {
            font-weight: 600;
            margin-right: 0.1in;
            min-width: 0.4in;
        }

        .contact-value {
            opacity: 0.95;
            word-break: break-all;
        }

        .print-button {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.75rem 1.5rem;
            background-color: #1e40af;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }

        .print-button:hover {
            background-color: #1e3a8a;
        }

        .instructions {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
            max-width: 300px;
            color: #1f2937;
        }

        .instructions strong {
            color: #1e40af;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .print-button,
            .instructions {
                display: none;
            }

            .card {
                box-shadow: none;
                page-break-inside: avoid;
            }
        }

        @media (max-width: 768px) {
            .card {
                width: 90vw;
                max-width: 400px;
            }

            .instructions {
                position: static;
                margin-top: 1rem;
                max-width: 100%;
            }

            .print-button {
                position: static;
                display: block;
                width: 100%;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <button class="print-button" onclick="window.print()">Print / Save as PDF</button>

    <div class="instructions">
        <strong>How to use:</strong>
        <ul style="margin-left: 1rem; margin-top: 0.5rem;">
            <li>Click "Print / Save as PDF" to save</li>
            <li>Or print directly to standard business cards (3.5" x 2")</li>
            <li>Save PDF to email or share digitally</li>
        </ul>
    </div>

    <div class="card-container">
        <div class="card">
            <div class="card-content">
                <div class="card-header">
                    <div class="logo">NotaVault</div>
                    <div class="tagline">Remote Online Notarization</div>
                </div>

                <div class="card-divider"></div>

                <div class="card-footer">
                    <div class="contact-item">
                        <span class="contact-label">📧</span>
                        <span class="contact-value">kw@notavaultllc.com</span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-label">🌐</span>
                        <span class="contact-value">notavault.net</span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-label">📍</span>
                        <span class="contact-value">Ohio</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
