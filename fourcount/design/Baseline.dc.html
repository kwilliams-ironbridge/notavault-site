</div>

<div style="flex: 1; background: #1e2530; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px;"><div style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #8b95a5;">Exhale</div><div style="font-size: 13px; color: #8b95a5;">Next</div></div>
</div>
<div style="display: flex; align-items: center; justify-content: center; height: 44px; color: #8b95a5; font-size: 15px; margin-top: 16px;">Cancel</div>
