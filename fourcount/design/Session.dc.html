<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; background: #0e1116; color: #e8e6e1; }
    a { color: #35c4b5; } a:hover { color: #6fe0d3; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0e1116; color: #e8e6e1; display: flex; flex-direction: column; padding: 64px 22px 40px; box-sizing: border-box; position: relative; overflow: hidden;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #35c4b5;">Resonance breathing</div>
    <div style="font-size: 14px; color: #8b95a5; padding: 10px 4px; cursor: pointer;" onClick="{{ stop }}">End</div>
  </div>
  <div style="position: relative; width: 300px; height: 300px; margin: 70px auto 0; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid #2a3340;"></div>
    <div style="position: absolute; inset: 40px; border-radius: 50%; border: 1px solid #2a3340; opacity: 0.6;"></div>
    <div style="width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #6fe0d3, #35c4b5 55%, #1d6b64); box-shadow: 0 0 70px rgba(53, 196, 181, 0.28); transform: scale({{ orb.scale }}); transition: transform {{ orb.dur }}s ease-in-out;"></div>
  </div>
  <div style="font-size: 28px; font-weight: 700; text-align: center; margin-top: 44px; letter-spacing: -0.01em;">{{ phase }}</div>
  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 72px; text-align: center; line-height: 1; margin-top: 8px;">{{ count }}</div>
  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; text-align: center; color: #8b95a5; margin-top: 14px;">{{ remain }}</div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px;">
    <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #35c4b5; color: #0e1116; font-weight: 700; font-size: 16px; cursor: pointer;" onClick="{{ start }}">Begin</div>
    </sc-if>
    <div style="display: flex; justify-content: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8b95a5;">
      <span style="color: #35c4b5;">5 in</span><span>·</span><span>5.5 out</span><span>·</span><span>nose only</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844},"minutes":{"editor":"int","default":5,"min":1,"max":10,"unit":"min"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { running: false, lead: 3, pi: -1, left: 0, elapsed: 0, done: false };
    this.phases = [
      { l: 'Inhale', s: 5, sc: 1.85 },
      { l: 'Exhale', s: 5.5, sc: 1 }
    ];
  }
  tick() {
    const s = this.state;
    const total = (this.props.minutes ?? 5) * 60;
    if (s.lead > 0) { this.setState({ lead: s.lead - 1 }); return; }
    let pi = s.pi, left = s.left;
    if (left <= 0) { pi = (pi + 1) % this.phases.length; left = this.phases[pi].s; }
    const elapsed = s.elapsed + 1;
    if (elapsed >= total) { clearInterval(this.t); this.setState({ running: false, done: true, pi: pi, left: 0, elapsed: elapsed }); return; }
    this.setState({ pi: pi, left: left - 1, elapsed: elapsed });
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state;
    const total = (this.props.minutes ?? 5) * 60;
    const start = () => {
      clearInterval(this.t);
      this.setState({ running: true, lead: 3, pi: -1, left: 0, elapsed: 0, done: false });
      this.t = setInterval(() => this.tick(), 1000);
    };
    const stop = () => { clearInterval(this.t); this.setState({ running: false, lead: 3, pi: -1, left: 0, elapsed: 0, done: false }); };
    const ph = s.pi >= 0 ? this.phases[s.pi] : null;
    let phase = 'Ready', count = String(this.props.minutes ?? 5) + ':00', orb = { scale: 1, dur: 1 };
    if (s.running && s.lead > 0) { phase = 'Get ready'; count = String(s.lead); }
    else if (s.running && ph) { phase = ph.l; count = String(Math.ceil(s.left + 1)); orb = { scale: ph.sc, dur: ph.s }; }
    else if (s.done) { phase = 'Complete'; count = '✓'; }
    const r = Math.max(0, total - s.elapsed);
    const remain = s.running ? (Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0') + ' left') : (s.done ? 'Session saved' : 'Tap Begin to run the guide');
    return { phase: phase, count: count, remain: remain, orb: orb, idle: !s.running, start: start, stop: stop };
  }
}
</script>
</body>
</html>
